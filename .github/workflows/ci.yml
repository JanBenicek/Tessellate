name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and GameTest
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Build and unit tests
        id: build
        run: bash ./gradlew build --no-daemon --stacktrace
      - name: NeoForge GameTests
        run: bash ./gradlew :neoforge:runGameTestServer --no-daemon --stacktrace
      - name: Fabric GameTests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: bash ./gradlew :fabric:runFabricGameTest --no-daemon --stacktrace
      - name: Upload mod JARs
        uses: actions/upload-artifact@v7
        with:
          name: tessellate-26.3-${{ github.sha }}
          path: |
            fabric/build/libs/*.jar
            neoforge/build/libs/*.jar
            !**/*-dev.jar
            !**/*-dev-shadow.jar
            !**/*-sources.jar
          if-no-files-found: error
          retention-days: 30
      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failure-reports
          path: |
            **/build/reports/**
            run/gametest/logs/**
            run-fabric-gametest/logs/**
            fabric/build/fabric-gametest.xml
            neoforge/build/gametest.xml
          if-no-files-found: ignore
          retention-days: 7
